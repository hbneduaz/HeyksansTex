<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050914" />
  <title>Heyksans Technology • Platforma</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
    <div class="bg__noise"></div>
  </div>

  <!-- Top -->
  <header class="top">
    <div class="wrap top__row">

      <!-- DÜZƏLDİLMİŞ LOQO HİSSƏSİ -->
      <a class="brand" href="#" aria-label="Heyksans Technology">
        <div class="brand__logo-wrap">
          <img class="brand__logo" src="assets/brand_logo.png" alt="Heyksans Technology loqosu">
        </div>
      </a>

      <nav class="top__actions" aria-label="Hesab">
        <button class="btn btn--ghost" id="btnLogin" type="button">Giriş</button>
        <button class="btn btn--primary" id="btnRegister" type="button">Qeydiyyat</button>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    <!-- Left -->
    <section class="panel panel--explore" aria-label="Kəşf et">
      <div class="panel__head">
        <h1 class="h1">Heyksans Technology Platforması</h1>
        <p class="muted">İstifadəçi qeydiyyatdan keçir, profil yaradır və portfolio yerləşdirir.</p>
      </div>

      <div class="search" role="search">
        <span class="search__icon" aria-hidden="true">⌕</span>
        <input id="q" class="search__input" type="search" placeholder="Axtarış (hazırda demo rejim)" autocomplete="off" />
        <button class="search__clear" id="clearSearch" type="button" aria-label="Təmizlə">×</button>
      </div>

      <div class="chips" id="chips" aria-label="Kateqoriyalar">
        <button class="chip is-active" type="button">Hamısı</button>
        <button class="chip" type="button">Dizayn</button>
        <button class="chip" type="button">Foto</button>
        <button class="chip" type="button">Video</button>
        <button class="chip" type="button">SMM</button>
        <button class="chip" type="button">Proqramlaşdırma</button>
      </div>

      <div class="section">
        <div class="section__head">
          <h2 class="h2">Profillər</h2>
          <span class="pill" id="resultCount">0</span>
        </div>

        <div class="emptyList">
          <div class="emptyList__title">Hələ profil yoxdur</div>
          <div class="emptyList__text">Qeydiyyat edib ilk profili yarada bilərsən.</div>
          <button class="btn btn--primary btn--sm" id="createFirst" type="button">Profil yarat</button>
        </div>
      </div>
    </section>

    <!-- Right -->
    <aside class="panel panel--preview" aria-label="Profil">
      <div class="preview__empty" id="emptyPreview">
        <div class="preview__badge">Profil</div>
        <h2 class="h2">Hələ profil yaradılmayıb</h2>
        <p class="muted">Qeydiyyat edib profil yaradandan sonra burada görünəcək.</p>

        <div class="emptyActions">
          <button class="btn btn--primary" id="openAuthFromEmpty" type="button">Qeydiyyat</button>
          <button class="btn btn--ghost" id="learnMore" type="button">Məlumat</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
